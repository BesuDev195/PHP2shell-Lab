<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 76" width="380" height="76" fill="none">
  <!-- Emblem Container (Rounded Dark Badge) -->
  <g transform="translate(6, 6)">
    <rect width="64" height="64" rx="14" fill="#242424" stroke="#333333" stroke-width="1.5" />
    <!-- Top Canopy Bar (Darker Forest Green) -->
    <path d="M 14 27 V 19 H 50 V 27" stroke="#228B22" stroke-width="4.8" stroke-linecap="square" stroke-linejoin="miter" />

    <!-- Radiating Connecting Branches (Vibrant Lime Green) -->
    <line x1="32" y1="30" x2="17" y2="39" stroke="#96D83B" stroke-width="4.2" stroke-linecap="round" />
    <line x1="32" y1="30" x2="32" y2="49" stroke="#96D83B" stroke-width="4.2" stroke-linecap="round" />
    <line x1="32" y1="30" x2="47" y2="39" stroke="#96D83B" stroke-width="4.2" stroke-linecap="round" />

    <!-- Network Nodes / Circular Vertices -->
    <circle cx="32" cy="30" r="5" fill="#96D83B" />
    <circle cx="17" cy="39" r="5.5" fill="#96D83B" />
    <circle cx="32" cy="49" r="5.5" fill="#96D83B" />
    <circle cx="47" cy="39" r="5.5" fill="#96D83B" />
  </g>

  <!-- Typography -->
  <g transform="translate(86, 18)">
    <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="25" font-weight="800" letter-spacing="1.2" fill="#FFFFFF">
      TECHTONIC <tspan fill="#96D83B">BANK</tspan>
    </text>
    <text x="1" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="8.5" font-weight="600" letter-spacing="2.4" fill="#94A3B8">
      ENTERPRISE TREASURY &amp; INFRASTRUCTURE
    </text>
  </g>
</svg>
